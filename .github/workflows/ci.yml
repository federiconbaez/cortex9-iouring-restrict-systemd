name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  enforce:
    name: enforce (kernel >= 7.0 BPF filter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: uname -a
      - name: apply must fail hard without support
        run: cargo run --bin iouring-restrict-enforce
