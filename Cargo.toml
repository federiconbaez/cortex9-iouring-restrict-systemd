[package]
name = "iouring-restrict-systemd"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "systemd RestrictIOUring= applicator: drop-in generator from io_uring JSON policy"
repository = "https://github.com/federiconbaez/cortex9-iouring-restrict-systemd"
keywords = ["io_uring", "systemd", "sandbox", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
authors = ["Federico Nicolas Báez Rizzo"]
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "iouring-restrict"
path = "src/main.rs"

[[bin]]
name = "iouring-restrict-enforce"
path = "src/bin/iouring-restrict-enforce.rs"

[lib]
name = "iouring_restrict_systemd"
path = "src/lib.rs"
